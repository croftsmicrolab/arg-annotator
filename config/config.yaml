  insert_cluster_distribution_pdf: results/07_plots/raw_sequence_cluster_rank.pdf
  reporf_support_distribution_pdf: results/07_plots/weighted_reporf_rank.pdf
tools:
  python: python
  snakemake: snakemake
  mmseqs: mmseqs
  prodigal: prodigal
  diamond: diamond
  rgi: rgi
  conda: conda
databases:
  swissprot_diamond: databases/swissprot/uniprot_sprot.dmnd
  rgi_working_directory: databases/rgi
  rgi_local_database: databases/rgi/localDB
resources:
  default_threads: 8
  mmseqs_threads: 8
  diamond_threads: 8
  rgi_threads: 8
plots:
  dpi: 300
  line_color: '#2C7FB8'
qc:
  allowed_nucleotide_symbols: ACGTN
  fasta_line_width: 80
  fail_on_invalid_bases: true
  fail_on_empty_sequences: true
insert_clustering:
  min_sequence_identity: 0.99
  coverage: 0.99
  coverage_mode: 0
  cluster_mode: 0
orf_prediction:
  mode: meta
  output_format: gff
orf_clustering:
  min_sequence_identity: 0.99
  coverage: 0.8
  coverage_mode: 1
  cluster_mode: 2
selection:
  nominal_fraction: 0.05
  rounding: ceiling
  ranking_keys:
  - support descending
  - ORF-cluster member count descending
  - RepORF ID ascending
  retain_all_support_one_as_exploratory: true
  mode: top_fraction
  minimum_support: 2
annotation:
  rgi:
    input_type: protein
    aligner: DIAMOND
    include_loose: true
    low_quality: true
    local: true
    clean: true
    enabled: true
  swissprot:
    mode: sensitive
    evalue: 0.001
    max_target_sequences: 25
    output_fields:
    - qseqid
    - sseqid
    - pident
    - length
    - mismatch
    - gapopen
    - qstart
    - qend
    - sstart
    - send
    - evalue
    - bitscore
    - qlen
    - slen
    - qcovhsp
    - scovhsp
    - stitle
    enabled: true
  evidence_thresholds:
    medium_identity: 40
    medium_query_coverage: 60
    low_identity: 25
    low_query_coverage: 30
  retain:
    loose_card_hits: true
    low_similarity_homologs: true
    very_remote_homologs: true
    hypothetical_or_uncharacterized: true
    partial_orfs: true
    no_hit_candidates: true
validation:
  expected_input_sequences: 0
  expected_insert_clusters: 0
  expected_predicted_orfs: 0
  expected_reporfs: 0
  expected_primary_candidates: 0
